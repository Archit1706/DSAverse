<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" role="img" aria-label="DSAverse">
    <!-- Maskable: full-bleed background with the mark inside the 80% safe zone,
         so Android can crop this to any shape without clipping the logo. -->
    <defs>
        <linearGradient id="dsaverseMaskable" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3B82F6" />
            <stop offset="50%" stop-color="#8B5CF6" />
            <stop offset="100%" stop-color="#EC4899" />
        </linearGradient>
    </defs>
    <rect width="32" height="32" fill="#020617" />
    <g transform="translate(6 6) scale(0.625)">
        <polygon points="16,2 27,8 27,24 16,30 5,24 5,8" fill="url(#dsaverseMaskable)" />
        <g fill="#ffffff" opacity="0.9">
            <circle cx="16" cy="10" r="1.5" />
            <circle cx="12" cy="16" r="1.2" />
            <circle cx="20" cy="16" r="1.2" />
            <circle cx="10" cy="22" r="1" />
            <circle cx="14" cy="22" r="1" />
            <circle cx="18" cy="22" r="1" />
            <circle cx="22" cy="22" r="1" />
            <line x1="16" y1="11" x2="12" y2="15" stroke="#ffffff" stroke-width="1" opacity="0.8" />
            <line x1="16" y1="11" x2="20" y2="15" stroke="#ffffff" stroke-width="1" opacity="0.8" />
            <line x1="12" y1="17" x2="10" y2="21" stroke="#ffffff" stroke-width="1" opacity="0.6" />
            <line x1="12" y1="17" x2="14" y2="21" stroke="#ffffff" stroke-width="1" opacity="0.6" />
            <line x1="20" y1="17" x2="18" y2="21" stroke="#ffffff" stroke-width="1" opacity="0.6" />
            <line x1="20" y1="17" x2="22" y2="21" stroke="#ffffff" stroke-width="1" opacity="0.6" />
        </g>
    </g>
</svg>
